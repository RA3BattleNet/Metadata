name: Build and Deploy to metadata.ra3battle.cn

on:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      
      - name: Build Output
        run: >
          dotnet run --project ./Ra3.BattleNet.Metadata --no-launch-profile --
          build --webp --src=./Metadata --dst=./Output
          --content-revision=${{ github.sha }}
      
      - name: Deploy to EdgeOne
        run: npx edgeone makers deploy ./Output -n metadata -t ${{ secrets.EDGEONE_API_TOKEN }} -e production
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}